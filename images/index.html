<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tegneserie: Politiker som springer vekk</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e3f2fd 0%, #f0f8ff 100%);
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #1a237e;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    p {
      color: #555;
      margin-bottom: 2rem;
      text-align: center;
      font-size: 1rem;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      max-width: 400px;
      width: 100%;
      border-radius: 12px;
    }
    .caption {
      margin-top: 1rem;
      color: #c62828;
      font-weight: bold;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>🎭 Tegneserie SVG</h1>
  <p>En skandinavisk politiker i dress som springer vekk med lommene fulle av penger!</p>
  <div class="card">
    <img src="cartoon-politician-running.svg" alt="Tegneseriefigur av en politiker i dress som springer vekk med penger i lommene" />
    <div class="caption">💨 Mann i dress springer vekk med pengene! 💨</div>
  </div>
</body>
</html>

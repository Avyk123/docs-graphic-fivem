<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="500" height="580">
  <!-- Background -->
  <rect width="500" height="580" fill="#e8f4fd" rx="20"/>

  <!-- ===== SPEED LINES (left side, going behind figure) ===== -->
  <line x1="10" y1="200" x2="110" y2="205" stroke="#b0bec5" stroke-width="4" stroke-linecap="round"/>
  <line x1="5"  y1="225" x2="105" y2="228" stroke="#b0bec5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8"  y1="250" x2="108" y2="252" stroke="#b0bec5" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="10" y1="275" x2="105" y2="276" stroke="#b0bec5" stroke-width="2" stroke-linecap="round"/>
  <line x1="6"  y1="300" x2="100" y2="301" stroke="#b0bec5" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="320" x2="108" y2="322" stroke="#b0bec5" stroke-width="2" stroke-linecap="round"/>

  <!-- ===== FLYING BANKNOTES (scattered around) ===== -->
  <!-- Top right floating note -->
  <g transform="translate(360,80) rotate(-18)">
    <rect width="70" height="36" rx="4" fill="#4caf50"/>
    <rect x="3" y="3" width="64" height="30" rx="3" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <circle cx="35" cy="18" r="8" fill="#388e3c"/>
    <text x="35" y="22" text-anchor="middle" font-size="9" fill="#c8e6c9" font-family="Arial" font-weight="bold">100</text>
    <text x="8"  y="14" font-size="7" fill="#a5d6a7" font-family="Arial">$</text>
    <text x="54" y="28" font-size="7" fill="#a5d6a7" font-family="Arial">$</text>
  </g>
  <!-- Right side floating note -->
  <g transform="translate(390,180) rotate(12)">
    <rect width="65" height="33" rx="4" fill="#66bb6a"/>
    <rect x="3" y="3" width="59" height="27" rx="3" fill="none" stroke="#388e3c" stroke-width="1.5"/>
    <circle cx="32" cy="16" r="7" fill="#43a047"/>
    <text x="32" y="20" text-anchor="middle" font-size="8" fill="#e8f5e9" font-family="Arial" font-weight="bold">100</text>
  </g>
  <!-- Lower right floating note -->
  <g transform="translate(370,290) rotate(-8)">
    <rect width="60" height="30" rx="4" fill="#4caf50"/>
    <rect x="3" y="3" width="54" height="24" rx="3" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="30" y="20" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">$100</text>
  </g>
  <!-- Top left floating note -->
  <g transform="translate(30,120) rotate(14)">
    <rect width="62" height="31" rx="4" fill="#43a047"/>
    <rect x="3" y="3" width="56" height="25" rx="3" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="31" y="19" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">$100</text>
  </g>
  <!-- Bottom left floating note -->
  <g transform="translate(25,370) rotate(-12)">
    <rect width="58" height="29" rx="4" fill="#66bb6a"/>
    <text x="29" y="19" text-anchor="middle" font-size="9" fill="#fff" font-family="Arial" font-weight="bold">$100</text>
  </g>

  <!-- ===== LEFT ARM (swinging back/up) ===== -->
  <!-- Upper arm -->
  <rect x="118" y="235" width="26" height="70" rx="13" fill="#1a237e" transform="rotate(-55, 131, 245)"/>
  <!-- Forearm -->
  <rect x="88"  y="190" width="24" height="60" rx="12" fill="#1a237e" transform="rotate(-20, 100, 210)"/>
  <!-- Left hand -->
  <ellipse cx="82" cy="170" rx="17" ry="14" fill="#f5c78e"/>

  <!-- ===== RIGHT ARM (pumping forward) ===== -->
  <!-- Upper arm -->
  <rect x="310" y="240" width="26" height="70" rx="13" fill="#1a237e" transform="rotate(50, 323, 250)"/>
  <!-- Forearm -->
  <rect x="350" y="310" width="24" height="60" rx="12" fill="#1a237e" transform="rotate(20, 362, 330)"/>
  <!-- Right hand -->
  <ellipse cx="370" cy="365" rx="17" ry="14" fill="#f5c78e"/>

  <!-- ===== BODY (suit jacket) ===== -->
  <rect x="160" y="240" width="140" height="140" rx="22" fill="#1a237e"/>

  <!-- Jacket inner shadow/lapels -->
  <polygon points="220,240 192,285 225,268" fill="#283593"/>
  <polygon points="240,240 268,285 235,268" fill="#283593"/>

  <!-- White shirt strip -->
  <polygon points="220,240 240,240 235,310 225,310" fill="#f5f5f5"/>

  <!-- Red tie -->
  <polygon points="223,245 237,245 241,318 230,325 219,318" fill="#d32f2f"/>
  <polygon points="230,315 241,315 237,332 230,334 223,332 219,315" fill="#b71c1c"/>

  <!-- Suit buttons -->
  <circle cx="230" cy="290" r="4" fill="#0d1b6e"/>
  <circle cx="230" cy="307" r="4" fill="#0d1b6e"/>

  <!-- ===== BANKNOTES STICKING OUT OF POCKETS ===== -->
  <!-- LEFT BREAST POCKET (3 notes) -->
  <rect x="170" y="248" width="26" height="40" rx="4" fill="#4caf50" transform="rotate(-12,183,248)"/>
  <text x="174" y="268" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(-12,183,248)">$$$</text>
  <rect x="181" y="244" width="22" height="36" rx="4" fill="#66bb6a" transform="rotate(-2,192,244)"/>
  <text x="185" y="262" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(-2,192,244)">$$$</text>
  <rect x="190" y="246" width="20" height="34" rx="4" fill="#43a047" transform="rotate(8,200,246)"/>
  <text x="193" y="264" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(8,200,246)">$$$</text>

  <!-- RIGHT JACKET POCKET (2 notes) -->
  <rect x="263" y="285" width="24" height="38" rx="4" fill="#4caf50" transform="rotate(15,275,285)"/>
  <text x="265" y="305" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(15,275,285)">$$$</text>
  <rect x="272" y="283" width="20" height="34" rx="4" fill="#66bb6a" transform="rotate(28,282,283)"/>
  <text x="274" y="300" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(28,282,283)">$$$</text>

  <!-- ===== LEFT LEG (swinging back, bent at knee) ===== -->
  <!-- Upper leg -->
  <rect x="172" y="370" width="38" height="90" rx="16" fill="#1a237e" transform="rotate(30, 191, 380)"/>
  <!-- Lower leg (bent back) -->
  <rect x="205" y="430" width="34" height="75" rx="14" fill="#1a237e" transform="rotate(75, 215, 440)"/>
  <!-- Left shoe -->
  <ellipse cx="258" cy="465" rx="32" ry="14" fill="#111" transform="rotate(25,258,465)"/>

  <!-- ===== RIGHT LEG (striding forward) ===== -->
  <!-- Upper leg -->
  <rect x="250" y="365" width="38" height="95" rx="16" fill="#1a237e" transform="rotate(-25, 269, 375)"/>
  <!-- Lower leg -->
  <rect x="220" y="435" width="34" height="80" rx="14" fill="#1a237e" transform="rotate(-10, 237, 450)"/>
  <!-- Right shoe -->
  <ellipse cx="212" cy="518" rx="36" ry="15" fill="#111" transform="rotate(-15,212,518)"/>

  <!-- ===== LEFT TROUSER POCKET NOTES ===== -->
  <rect x="175" y="370" width="26" height="44" rx="4" fill="#43a047"/>
  <rect x="178" y="368" width="22" height="40" rx="4" fill="#66bb6a"/>
  <text x="181" y="390" font-size="8" fill="#fff" font-family="Arial" font-weight="bold">$$$</text>
  <rect x="184" y="366" width="20" height="36" rx="4" fill="#4caf50" transform="rotate(8,194,366)"/>
  <text x="186" y="385" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(8,194,366)">$$$</text>

  <!-- ===== RIGHT TROUSER POCKET NOTES ===== -->
  <rect x="256" y="368" width="26" height="44" rx="4" fill="#4caf50" transform="rotate(-5,269,368)"/>
  <text x="260" y="390" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(-5,269,368)">$$$</text>
  <rect x="265" y="365" width="22" height="38" rx="4" fill="#66bb6a" transform="rotate(10,276,365)"/>
  <text x="268" y="384" font-size="8" fill="#fff" font-family="Arial" font-weight="bold" transform="rotate(10,276,365)">$$$</text>

  <!-- ===== NECK ===== -->
  <rect x="218" y="195" width="28" height="52" rx="10" fill="#f5c78e"/>

  <!-- ===== HEAD ===== -->
  <ellipse cx="232" cy="158" rx="68" ry="72" fill="#f5c78e"/>

  <!-- Ears -->
  <ellipse cx="164" cy="165" rx="14" ry="18" fill="#f5c78e"/>
  <ellipse cx="164" cy="165" rx="8"  ry="11" fill="#e8a870"/>
  <ellipse cx="300" cy="165" rx="14" ry="18" fill="#f5c78e"/>
  <ellipse cx="300" cy="165" rx="8"  ry="11" fill="#e8a870"/>

  <!-- ===== HAIR (short, dark) ===== -->
  <ellipse cx="232" cy="90"  rx="66" ry="36" fill="#2c1810"/>
  <ellipse cx="196" cy="110" rx="24" ry="32" fill="#2c1810"/>
  <ellipse cx="268" cy="110" rx="24" ry="32" fill="#2c1810"/>
  <ellipse cx="232" cy="88"  rx="50" ry="24" fill="#3d2314"/>

  <!-- ===== EYEBROWS (worried/stressed — inner corners raised) ===== -->
  <path d="M192,128 Q208,114 222,122" stroke="#2c1810" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M242,122 Q256,114 272,128" stroke="#2c1810" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== EYES (wide, alarmed) ===== -->
  <!-- Left eye white -->
  <ellipse cx="210" cy="148" rx="18" ry="20" fill="white"/>
  <!-- Left iris -->
  <ellipse cx="212" cy="150" rx="11" ry="13" fill="#6d4c41"/>
  <!-- Left pupil -->
  <ellipse cx="213" cy="151" rx="6"  ry="7"  fill="#1a0a00"/>
  <!-- Left highlight -->
  <ellipse cx="216" cy="147" rx="4"  ry="4"  fill="white"/>

  <!-- Right eye white -->
  <ellipse cx="254" cy="148" rx="18" ry="20" fill="white"/>
  <!-- Right iris -->
  <ellipse cx="256" cy="150" rx="11" ry="13" fill="#6d4c41"/>
  <!-- Right pupil -->
  <ellipse cx="257" cy="151" rx="6"  ry="7"  fill="#1a0a00"/>
  <!-- Right highlight -->
  <ellipse cx="260" cy="147" rx="4"  ry="4"  fill="white"/>

  <!-- ===== NOSE ===== -->
  <path d="M232,162 Q222,178 218,188 Q232,194 246,188 Q242,178 232,162" fill="#e8a060"/>

  <!-- ===== MOUTH (nervous grimace, teeth showing) ===== -->
  <path d="M208,205 Q220,197 232,200 Q244,197 256,205" stroke="#7b3f00" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M212,205 Q232,200 252,205 L252,214 Q232,218 212,214 Z" fill="white" stroke="#9e5c20" stroke-width="1.5"/>
  <!-- Teeth lines -->
  <line x1="222" y1="205" x2="222" y2="214" stroke="#ddd" stroke-width="1.5"/>
  <line x1="232" y1="204" x2="232" y2="214" stroke="#ddd" stroke-width="1.5"/>
  <line x1="242" y1="205" x2="242" y2="214" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== ROSY CHEEKS ===== -->
  <ellipse cx="188" cy="180" rx="16" ry="9" fill="#ef9a9a" opacity="0.45"/>
  <ellipse cx="276" cy="180" rx="16" ry="9" fill="#ef9a9a" opacity="0.45"/>

  <!-- ===== SWEAT DROPS ===== -->
  <!-- Left of head -->
  <path d="M158,130 Q153,143 158,153 Q163,143 158,130" fill="#64b5f6" opacity="0.9"/>
  <path d="M148,160 Q144,171 148,179 Q152,171 148,160" fill="#64b5f6" opacity="0.9"/>
  <!-- Right of head -->
  <path d="M308,125 Q313,138 308,148 Q303,138 308,125" fill="#64b5f6" opacity="0.9"/>
  <path d="M315,158 Q320,169 315,177 Q310,169 315,158" fill="#64b5f6" opacity="0.9"/>
  <!-- Forehead -->
  <path d="M242,80 Q247,93 242,103 Q237,93 242,80" fill="#64b5f6" opacity="0.9"/>
  <path d="M218,76 Q222,87 218,96 Q214,87 218,76" fill="#64b5f6" opacity="0.9"/>

  <!-- ===== DUST CLOUD under feet ===== -->
  <ellipse cx="220" cy="538" rx="38" ry="14" fill="#cfd8dc" opacity="0.7"/>
  <ellipse cx="200" cy="532" rx="22" ry="12" fill="#eceff1" opacity="0.6"/>
  <ellipse cx="240" cy="534" rx="18" ry="10" fill="#cfd8dc" opacity="0.5"/>
  <ellipse cx="262" cy="525" rx="26" ry="11" fill="#eceff1" opacity="0.5"/>

  <!-- ===== CAPTION ===== -->
  <text x="250" y="565" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" font-weight="bold" fill="#b71c1c">💨 Springer vekk med pengene! 💨</text>
</svg>
